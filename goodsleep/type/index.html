    <h1>나는 어떤<br>잠꾸러기일까?</h1>
    <p class="lead" id="lead">질문 10개에 답하면 잠버릇이 닮은 동물과 어울리는 밤의 소리를 알려 드려요. 1분이면 끝나요.</p>

    <button class="btn primary" id="start">테스트 시작하기</button>
  </div>
  <div class="spacer"></div>

  답변은 이 기기 안에서만 계산되고 어디에도 저장되거나 전송되지 않아요.</p>
</main>
<script>
const D={"q": [["불을 끄고 누우면", [["💭", "오늘 했던 말이 다시 재생된다", {"owl": 2}], ["😴", "눈 감자마자 잠든다", {"panda": 2}], ["👂", "바깥 소리가 하나하나 들린다", {"rabbit": 2}], ["🌃", "이제부터가 진짜 내 시간이다", {"bat": 2}]]], ["새벽에 깨는 일은", [["🌙", "거의 없다", {"panda": 1, "bear": 1}], ["🐾", "한두 번은 꼭 깬다", {"cat": 2}], ["🔊", "밖에서 나는 소리 때문에 깬다", {"rabbit": 2}], ["🕐", "깰 일이 없다, 아직 안 잤으니까", {"bat": 2, "owl": 1}]]], ["가장 잠이 잘 오는 곳은", [["🚌", "흔들리는 버스나 기차", {"koala": 2}], ["🛏️", "조용하고 어두운 내 침대", {"rabbit": 1, "cat": 1}], ["🌏", "어디든, 언제든", {"panda": 2}], ["📺", "TV를 켜 둔 소파", {"sloth": 2}]]], ["아침 알람이 울리면", [["⏰", "한 번에 일어난다", {"panda": 2}], ["🔁", "스누즈를 세 번은 누른다", {"sloth": 2}], ["👀", "알람보다 먼저 깨 있다", {"cat": 2}], ["🤷", "알람을 끈 기억이 없다", {"sloth": 1, "bear": 2}]]], ["잠들기 직전 휴대폰은", [["📱", "잠들 때까지 손에 들고 있다", {"bat": 2, "sloth": 1}], ["🎧", "화면은 끄고 소리만 틀어 둔다", {"koala": 2}], ["🚫", "멀리 두고 잔다", {"panda": 1, "cat": 1}], ["📅", "내일 일정을 보다 생각이 많아진다", {"owl": 2}]]], ["옆 사람이 코를 골면", [["😱", "그날 밤은 끝이다", {"rabbit": 2}], ["😑", "신경 쓰이지만 결국 잔다", {"cat": 1, "panda": 1}], ["🎵", "자장가처럼 들린다", {"koala": 2}], ["🙊", "사실 코 고는 쪽이 나다", {"bear": 2}]]], ["주말 아침에는", [["☀️", "평일과 비슷한 시간에 일어난다", {"panda": 1, "cat": 1}], ["🕛", "점심 무렵까지 잔다", {"sloth": 1, "bat": 1}], ["🔄", "일찍 깨서 이불 속에서 뒤척인다", {"owl": 1, "cat": 1}], ["💤", "아침잠에 낮잠까지 두 번 잔다", {"bear": 2}]]], ["가장 좋아하는 밤의 소리는", [["🌧️", "창밖 빗소리", {"cat": 1, "sloth": 1}], ["🌊", "밀려오는 파도", {"owl": 2}], ["🌀", "선풍기 바람 소리", {"rabbit": 2}], ["🚂", "덜컹거리는 기차", {"koala": 2}]]], ["밤 12시, 지금 나는", [["🛌", "이미 꿈나라", {"panda": 1, "bear": 1}], ["🎮", "하던 거 마저 하는 중", {"bat": 2}], ["🤔", "누웠는데 생각이 꼬리를 문다", {"owl": 2}], ["🫠", "소파에서 잠들었다 깼다 반복", {"sloth": 1, "cat": 1}]]], ["낮잠을 자고 나면", [["😊", "개운하다, 매일 자고 싶다", {"bear": 2}], ["😵", "오히려 더 피곤하다", {"sloth": 2}], ["🙅", "낮잠은 거의 안 잔다", {"bat": 1, "rabbit": 1}], ["🚃", "출퇴근길에 자는 게 낮잠이다", {"koala": 2}]]]], "order": ["owl", "cat", "rabbit", "koala", "sloth", "panda", "bat", "bear"], "names": {"owl": ["🦉", "생각 많은 부엉이", "부엉이", "와"], "cat": ["🐈", "예민한 고양이", "고양이", "와"], "rabbit": ["🐇", "귀 밝은 토끼", "토끼", "와"], "koala": ["🐨", "흔들흔들 코알라", "코알라", "와"], "sloth": ["🦥", "아침이 힘든 나무늘보", "나무늘보", "와"], "panda": ["🐼", "어디서나 꿀잠 판다", "판다", "와"], "bat": ["🦇", "밤이 좋은 박쥐", "박쥐", "와"], "bear": ["🐻", "겨울잠 곰", "곰", "과"]}};
const view=document.getElementById('view');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const vsRaw=new URLSearchParams(location.search).get('vs');
const vs=D.order.includes(vsRaw)?vsRaw:null;
if(vs){const n=D.names[vs];
  document.getElementById('lead').textContent='친구는 '+n[0]+' '+n[1]+'예요. 나는 어떤 잠꾸러기인지 알아보고 둘의 잠자리 궁합도 확인해 보세요.';}
let i=0;const picks=[];
function setMoon(p){const s=document.getElementById('moonShadow');if(s)s.setAttribute('cx',(60-92*Math.max(p,0.12)).toFixed(1));
  const g=document.querySelector('.moon circle');if(g)g.setAttribute('opacity',p.toFixed(2));}
function shuffle(a){for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]];}return a;}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function render(){
  const [q,opts]=D.q[i];
  view.classList.remove('fade');void view.offsetWidth;view.classList.add('fade');
  const moon=document.querySelector('.moon').outerHTML;
  view.innerHTML=moon+'<div class="count"><span>'+(i+1)+' / '+D.q.length+'</span>'+(i>0?'<button class="back" id="back">이전 질문</button>':'')+
    '</div><h2 class="q" tabindex="-1">'+esc(q)+'</h2><div class="opts" role="group" aria-label="'+esc(q)+'"></div>';
  setMoon(i/D.q.length);
  const box=view.querySelector('.opts');
  // 보기 순서는 매번 섞는다. 점수는 원래 순서(k)로 계산한다.
  shuffle(opts.map((_,k)=>k)).forEach(k=>{const [e,label]=opts[k];const b=document.createElement('button');b.className='btn opt';
    b.innerHTML='<span class="e" aria-hidden="true">'+e+'</span><span>'+esc(label)+'</span>';
    b.onclick=()=>pick(k);box.appendChild(b);});
  const back=document.getElementById('back');if(back)back.onclick=()=>{picks.pop();i--;render();};
  // 새 질문으로 포커스를 옮긴다(화면 낭독기). 선택지에 두면 이미 고른 것처럼 보인다.
  view.querySelector('.q').focus({preventScroll:true});
}
function pick(k){picks.push(k);i++;if(i<D.q.length){render();return;}finish();}
function finish(){
  const scores={};
  picks.forEach((k,qi)=>{const pts=D.q[qi][1][k][2];for(const t in pts)scores[t]=(scores[t]||0)+pts[t];});
  const top=Math.max(...D.order.map(t=>scores[t]||0));
  const tied=D.order.filter(t=>(scores[t]||0)===top);
  // 동점이면 답변 조합으로 정해지는 순번으로 고른다(같은 답이면 같은 결과, 유형이 한쪽으로 쏠리지 않게).
  const h=picks.reduce((a,k)=>(a*31+k+1)%1000003,7);
  const best=tied[h%tied.length];
  const moon=document.querySelector('.moon').outerHTML;

  setMoon(1);
  setTimeout(()=>{location.href=best+'.html?from=quiz'+(vs?'&vs='+vs:'');},RM?300:1400);
}

if(m&&+m[1]>=1&&+m[1]<=D.q.length){i=+m[1]-1;for(let k=0;k<i;k++)picks.push(0);render();}
